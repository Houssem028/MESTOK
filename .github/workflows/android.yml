name: Build MESTOK Android APK
on:
  push:
    branches: [ "main", "mvp/android-foundation" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Apply stable MESTOK signing key when configured
        shell: bash
        env:
          MESTOK_KEYSTORE_BASE64: ${{ secrets.MESTOK_KEYSTORE_BASE64 }}
          MESTOK_STORE_PASSWORD: ${{ secrets.MESTOK_STORE_PASSWORD }}
          MESTOK_KEY_ALIAS: ${{ secrets.MESTOK_KEY_ALIAS }}
          MESTOK_KEY_PASSWORD: ${{ secrets.MESTOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -n "$MESTOK_KEYSTORE_BASE64" ] && [ -n "$MESTOK_STORE_PASSWORD" ] && [ -n "$MESTOK_KEY_ALIAS" ] && [ -n "$MESTOK_KEY_PASSWORD" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)"
            KEYSTORE="$RUNNER_TEMP/mestok-upload-key.jks"
            SIGNED_APK="$RUNNER_TEMP/mestok-signed.apk"
            trap 'rm -f "$KEYSTORE" "$SIGNED_APK"' EXIT
            printf '%s' "$MESTOK_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$MESTOK_KEY_ALIAS" --ks-pass env:MESTOK_STORE_PASSWORD --key-pass env:MESTOK_KEY_PASSWORD --out "$SIGNED_APK" "$APK"
            mv "$SIGNED_APK" "$APK"
            echo "Stable MESTOK signing key applied."
          else
            echo "::warning::Stable signing secrets are not configured. This APK uses the temporary debug key; its fingerprint may change on the next runner."
          fi
      - name: Show APK signing certificate SHA-256
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MESTOK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
# Trigger CI to verify stable signing secrets.
