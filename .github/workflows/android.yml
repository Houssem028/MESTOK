name: Build MESTOK Android APK
on:
  push:
    branches: [ "main", "mvp/android-foundation" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Show APK signing certificate SHA-256
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK path is not configured"
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MESTOK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
