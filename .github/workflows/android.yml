name: Build MESTOK Android APK
on:
  push:
    branches: [ "main", "mvp/android-foundation" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Show debug signing certificate SHA-256
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android | grep "SHA256:"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MESTOK-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
